<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixora</title>
<style>
  :root { --bg:#f4f4f6; --panel:#fff; --line:#d8d8de; --fg:#1c1c22; --accent:#5b5bd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --panel:#202026; --line:#34343c; --fg:#ececf1; --accent:#8b8bf0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-columns:1fr 260px; height:100vh; }
  @media (max-width:700px) { body { grid-template-columns:1fr; grid-template-rows:1fr auto; } }
  main { display:flex; align-items:center; justify-content:center; padding:16px; min-width:0; min-height:0; }
  canvas { max-width:100%; max-height:100%; touch-action:none; box-shadow:0 2px 12px #0003;
           background:repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/16px 16px; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:12px;
          display:flex; flex-direction:column; gap:12px; overflow:auto; }
  label { display:flex; flex-direction:column; gap:4px; font-weight:600; }
  select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px;
                   background:var(--bg); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  li { display:flex; align-items:center; gap:6px; padding:4px; border:1px solid var(--line); border-radius:6px; }
  li.sel { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
  li img { width:36px; height:36px; object-fit:cover; border-radius:4px; }
  li span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  li button { padding:2px 8px; }
  .hint { color:#888; font-size:12px; }
</style>
</head>
<body>
<main><canvas id="c" aria-label="썸네일 캔버스"></canvas></main>
<aside>
  <label>비율
    <select id="ratio">
      <option value="1:1">1:1</option>
      <option value="4:3">4:3</option>
      <option value="16:9" selected>16:9</option>
      <option value="9:16">9:16</option>
      <option value="3:4">3:4</option>
    </select>
  </label>
  <button id="add">이미지 불러오기</button>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div>
    <strong>레이어 (위가 맨 앞)</strong>
    <ul id="layers"></ul>
    <p class="hint" id="empty">이미지를 불러오거나 화면에 끌어다 놓으세요.</p>
  </div>
  <button id="save" class="primary">WebP로 저장</button>
</aside>
<script>
const LONG = 1280, HANDLE = 28, QUALITY = 0.9;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let layers = [];   // 뒤 -> 앞 순서. 마지막이 맨 위.
let sel = null;    // 선택된 레이어 객체

function setRatio() {
  const [a, b] = $('ratio').value.split(':').map(Number);
  cv.width = a >= b ? LONG : Math.round(LONG * a / b);
  cv.height = a >= b ? Math.round(LONG * b / a) : LONG;
  draw();
}

function draw(forExport) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (const l of layers) ctx.drawImage(l.img, l.x, l.y, l.w, l.h);
  if (sel && !forExport) {
    ctx.save();
    ctx.strokeStyle = '#5b5bd6'; ctx.lineWidth = 3; ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
    ctx.fillStyle = '#5b5bd6'; ctx.fillRect(sel.x + sel.w - HANDLE / 2, sel.y + sel.h - HANDLE / 2, HANDLE, HANDLE);
    ctx.restore();
  }
}

function renderList() {
  const ul = $('layers'); ul.textContent = '';
  $('empty').hidden = layers.length > 0;
  [...layers].reverse().forEach(l => {
    const li = document.createElement('li'); if (l === sel) li.className = 'sel';
    const th = new Image(); th.src = l.img.src; th.alt = '';
    const name = document.createElement('span'); name.textContent = l.name;
    name.onclick = () => { sel = l; refresh(); };
    li.append(th, name,
      btn('▲', '앞으로', () => move(l, 1)),
      btn('▼', '뒤로', () => move(l, -1)),
      btn('✕', '삭제', () => { layers = layers.filter(x => x !== l); if (sel === l) sel = null; refresh(); }));
    ul.append(li);
  });
}
function btn(text, label, fn) {
  const b = document.createElement('button'); b.textContent = text; b.title = label; b.setAttribute('aria-label', label); b.onclick = fn; return b;
}
function move(l, d) {
  const i = layers.indexOf(l), j = i + d;
  if (j < 0 || j >= layers.length) return;
  [layers[i], layers[j]] = [layers[j], layers[i]]; refresh();
}
function refresh() { renderList(); draw(); }

function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const img = new Image();
    img.onload = () => {
      const s = Math.min(cv.width / img.naturalWidth, cv.height / img.naturalHeight, 1);
      const w = img.naturalWidth * s, h = img.naturalHeight * s;
      sel = { img, name: f.name, w, h, x: (cv.width - w) / 2, y: (cv.height - h) / 2 };
      layers.push(sel); refresh();
    };
    img.src = URL.createObjectURL(f);
  }
}

// 포인터: 핸들이면 크기 조절, 이미지면 이동
let drag = null;
const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
cv.addEventListener('pointerdown', e => {
  const p = pos(e);
  if (sel && Math.abs(p.x - (sel.x + sel.w)) < HANDLE && Math.abs(p.y - (sel.y + sel.h)) < HANDLE) {
    drag = { mode: 'resize', p, w: sel.w, h: sel.h };
  } else {
    sel = [...layers].reverse().find(l => p.x >= l.x && p.x <= l.x + l.w && p.y >= l.y && p.y <= l.y + l.h) || null;
    if (sel) drag = { mode: 'move', p, x: sel.x, y: sel.y };
    renderList(); draw();
  }
  if (drag) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag || !sel) return;
  const p = pos(e);
  if (drag.mode === 'move') { sel.x = drag.x + p.x - drag.p.x; sel.y = drag.y + p.y - drag.p.y; }
  else { const k = Math.max(0.05, (drag.w + p.x - drag.p.x) / drag.w); sel.w = drag.w * k; sel.h = drag.h * k; }
  draw();
});
cv.addEventListener('pointerup', () => { drag = null; });

$('ratio').onchange = setRatio;
$('add').onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });
$('save').onclick = () => {
  if (!layers.length) return alert('먼저 이미지를 불러오세요.');
  draw(true);
  cv.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'thumbnail.webp'; a.click();
    URL.revokeObjectURL(a.href); draw();
  }, 'image/webp', QUALITY);
};

setRatio();
</script>
</body>
</html>
