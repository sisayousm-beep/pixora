<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#252525">
<title>Pixora</title>
<style>
  :root {
    color-scheme: dark;
    --app:#1E1E1E; --bar:#252525; --well:#141414; --line:#333333; --line2:#3A3A3A;
    --fg:#EDEDED; --muted:#A0A0A0; --dim:#6E6E6E; --accent:#31A8FF; --on-accent:#0B1B2B; --sel:#1F3A52;
    --checker:repeating-conic-gradient(#2a2a2a 0 25%, #333 0 50%) 0 0/16px 16px;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#0E0E0E; }
  body { font:13px/1.3 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--fg);
         max-width:520px; margin:0 auto; height:100dvh; background:var(--app);
         display:grid; grid-template-rows:auto minmax(0,1fr) auto auto auto; overflow:hidden; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  svg { display:block; }
  /* 16px 미만이면 iOS가 포커스 때 확대한다 */
  .num { height:36px; padding:0 8px; background:var(--well); border:1px solid var(--line2); border-radius:6px;
         font-size:16px; font-variant-numeric:tabular-nums; color:var(--fg); }
  .num:disabled { color:var(--dim); }

  header { display:flex; align-items:center; gap:2px; height:52px; padding:0 6px 0 16px;
           padding-top:env(safe-area-inset-top); background:var(--bar); border-bottom:1px solid var(--line); }
  header h1 { flex:1; margin:0; font-size:15px; font-weight:600; }
  .icon { width:44px; height:44px; border:0; border-radius:8px; background:none;
          display:flex; align-items:center; justify-content:center; }
  .icon:disabled { color:var(--dim); cursor:default; }

  main { position:relative; min-height:0; background:var(--well);
         display:flex; align-items:center; justify-content:center; padding:16px; }
  #c { max-width:100%; max-height:100%; touch-action:none; box-shadow:0 4px 24px #00000080; background:var(--checker); }
  #info { position:absolute; left:12px; bottom:8px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }

  .frames { display:flex; align-items:center; gap:6px; padding:8px 12px; overflow-x:auto;
            background:var(--bar); border-top:1px solid var(--line); }
  .frame { position:relative; flex-shrink:0; height:48px; min-width:48px; padding:3px; border:1px solid var(--line2);
           border-radius:6px; background:var(--app); display:flex; align-items:center; justify-content:center; }
  .frame[aria-pressed=true] { border:2px solid var(--accent); padding:2px; }
  .frame canvas, .durs canvas { display:block; height:40px; border-radius:3px; background:var(--checker); }
  .frame b { position:absolute; left:3px; top:3px; min-width:16px; padding:0 4px; border-radius:3px;
             background:#000000B0; font-size:10px; line-height:16px; }
  .frame-add { flex-shrink:0; width:48px; height:48px; border:1px dashed #555; border-radius:6px; background:none;
               color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .frame-del { flex-shrink:0; margin-left:auto; }

  [role=tablist] { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); height:48px;
                   background:var(--bar); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  [role=tab] { border:0; background:none; color:var(--muted); }
  [role=tab][aria-selected=true] { color:var(--fg); font-weight:600; box-shadow:inset 0 -2px 0 var(--accent); }

  .panel { height:min(46dvh, 400px); padding-bottom:env(safe-area-inset-bottom); }
  [role=tabpanel] { height:100%; display:flex; flex-direction:column; overflow:auto; }

  #layers { list-style:none; margin:0; padding:6px 8px; display:flex; flex-direction:column; gap:2px; }
  .row { width:100%; height:48px; display:flex; align-items:center; gap:10px; padding:0 8px;
         border:0; border-radius:6px; background:none; text-align:left; }
  .row[aria-pressed=true] { background:var(--sel); font-weight:500; }
  .row img { width:32px; height:32px; object-fit:cover; border-radius:4px; flex-shrink:0; background:var(--well); }
  .row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .dim { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .empty { margin:auto; padding:24px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:12px; align-items:center; }

  .props { margin:4px 16px 12px; padding-top:12px; border:0; border-top:1px solid var(--line); min-width:0; }
  .props legend, .label { float:left; width:100%; margin-bottom:10px; padding:0; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em; }
  .props .grid { clear:both; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
  .props label { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); }
  .props .num { width:100%; }
  .props .fit { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:8px; }

  .actions { margin-top:auto; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px;
             padding:10px 12px 14px; background:var(--bar); border-top:1px solid var(--line); position:sticky; bottom:0; }
  .actions.one { grid-template-columns:1fr; }
  .btn { height:44px; padding:0 12px; border:1px solid var(--line2); border-radius:8px; background:var(--app);
         display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn:disabled { color:var(--dim); cursor:default; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }

  .ratios { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:16px; }
  .ratio { height:96px; border:1px solid var(--line2); border-radius:8px; background:var(--app);
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); }
  .ratio[aria-pressed=true] { border-color:var(--accent); color:var(--fg); background:var(--sel); }
  .ratio i { display:block; border:1.5px solid currentColor; border-radius:2px; }

  .export { padding:16px; display:flex; flex-direction:column; gap:16px; }
  .export dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:10px 16px; }
  .export dt { color:var(--muted); }
  .export dd { margin:0; font-variant-numeric:tabular-nums; }
  .anim { display:flex; flex-direction:column; gap:12px; padding-top:16px; border-top:1px solid var(--line); }
  .line { display:flex; align-items:center; gap:8px; }
  .line > span:first-child { width:72px; flex-shrink:0; color:var(--muted); }
  .line .num { width:84px; }
  .hint { color:var(--muted); font-size:12px; }
  .durs { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .durs li { display:flex; align-items:center; gap:10px; }
  .durs li span { flex:1; }
  .durs .num { width:84px; }
</style>
</head>
<body>
<header>
  <h1>Pixora</h1>
  <button class="icon" id="undo" aria-label="실행 취소" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
  </button>
  <button class="icon" id="redo" aria-label="다시 실행" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
  </button>
  <button class="icon" id="add" aria-label="이미지 불러오기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
  </button>
  <input id="file" type="file" accept="image/*" multiple hidden>
</header>

<main>
  <canvas id="c" aria-label="썸네일 캔버스"></canvas>
  <span id="info"></span>
</main>

<div class="frames" role="group" aria-label="장면">
  <div id="frame-list" style="display:contents"></div>
  <button class="frame-add" id="frame-add" aria-label="장면 추가">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon frame-del" id="frame-del" aria-label="현재 장면 삭제">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
  </button>
</div>

<nav role="tablist" aria-label="패널">
  <button role="tab" id="t-layers" aria-controls="p-layers" aria-selected="true">레이어</button>
  <button role="tab" id="t-ratio" aria-controls="p-ratio" aria-selected="false">비율</button>
  <button role="tab" id="t-export" aria-controls="p-export" aria-selected="false">내보내기</button>
</nav>

<div class="panel">
  <section role="tabpanel" id="p-layers" aria-labelledby="t-layers">
    <ul id="layers"></ul>
    <div class="empty" id="empty">
      이 장면에 이미지를 불러오세요.
      <button class="btn primary" id="add2" style="padding:0 20px">이미지 불러오기</button>
    </div>
    <fieldset class="props" id="props">
      <legend>속성</legend>
      <div class="grid">
        <label>X<input class="num" id="px" type="number" inputmode="numeric"></label>
        <label>Y<input class="num" id="py" type="number" inputmode="numeric"></label>
        <label>W<input class="num" id="pw" type="number" inputmode="numeric" min="1"></label>
        <label>H<input class="num" id="ph" type="number" inputmode="numeric" min="1"></label>
      </div>
      <div class="fit">
        <button class="btn" id="fit-contain" title="이미지 전체가 캔버스 안에 들어가게">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>맞추기</button>
        <button class="btn" id="fit-cover" title="캔버스를 빈틈없이 채우게 (넘치는 부분은 잘림)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>채우기</button>
      </div>
    </fieldset>
    <div class="actions" id="actions">
      <button class="btn" id="fwd">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>앞으로</button>
      <button class="btn" id="back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>뒤로</button>
      <button class="btn" id="del">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>삭제</button>
    </div>
  </section>

  <section role="tabpanel" id="p-ratio" aria-labelledby="t-ratio" hidden>
    <div class="ratios">
      <button class="ratio" data-ratio="1:1"><i style="width:28px;height:28px"></i>1:1</button>
      <button class="ratio" data-ratio="4:3"><i style="width:32px;height:24px"></i>4:3</button>
      <button class="ratio" data-ratio="16:9"><i style="width:36px;height:20px"></i>16:9</button>
      <button class="ratio" data-ratio="9:16"><i style="width:20px;height:36px"></i>9:16</button>
      <button class="ratio" data-ratio="3:4"><i style="width:24px;height:32px"></i>3:4</button>
    </div>
    <p class="hint" style="margin:0 16px">비율은 모든 장면에 같이 적용됩니다.</p>
  </section>

  <section role="tabpanel" id="p-export" aria-labelledby="t-export" hidden>
    <div class="export">
      <dl>
        <dt>크기</dt><dd id="e-size"></dd>
        <dt>형식</dt><dd id="e-format"></dd>
        <dt>투명 영역</dt><dd>이미지가 없는 곳은 투명하게 저장</dd>
      </dl>
      <div class="anim" id="anim">
        <label class="line"><span>반복 횟수</span>
          <input class="num" id="loops" type="number" inputmode="numeric" min="0" max="65535" step="1" value="0">
          <span class="hint">0 = 무한 반복</span></label>
        <div class="line"><label for="dur-all" style="width:72px;flex-shrink:0;color:var(--muted)">일괄 시간</label>
          <input class="num" id="dur-all" type="number" inputmode="decimal" min="0.1" step="0.1" value="2">
          <span class="hint">초</span>
          <button class="btn" id="dur-apply" style="margin-left:auto">모두 적용</button></div>
        <span class="label" style="margin:4px 0 0">장면별 시간 (초)</span>
        <ul class="durs" id="durs"></ul>
      </div>
    </div>
    <div class="actions one">
      <button class="btn primary" id="save">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>WebP로 저장</button>
    </div>
  </section>
</div>

<script>
const LONG_SIDE = 1280, QUALITY = 0.9, HIT = 22;  // HIT: 모서리 핸들 터치 반경 (화면 px)
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let ratio = '16:9';
// 장면마다 layers(뒤 -> 앞, 마지막이 맨 위)와 표시 시간(초)을 가진다
const durDefault = () => clampDur(Number($('dur-all').value));
const clampDur = v => Number.isFinite(v) ? Math.min(16000, Math.max(0.1, Math.round(v * 10) / 10)) : 2;
let frames = [{ layers: [], dur: 2 }], cur = 0;
let sel = null;
const F = () => frames[cur];

// ---- 실행 취소: 바뀌기 직전 상태를 쌓아 둔다 ----
let past = [], future = [];
const copy = fs => fs.map(f => ({ ...f, layers: f.layers.map(l => ({ ...l })) }));
const snap = () => ({ frames: copy(frames), cur, sel: F().layers.indexOf(sel) });
function restore(s) { frames = copy(s.frames); cur = s.cur; sel = F().layers[s.sel] || null; refresh(); }
function save(s = snap()) { past.push(s); future = []; }
$('undo').onclick = () => { if (past.length) { future.push(snap()); restore(past.pop()); } };
$('redo').onclick = () => { if (future.length) { past.push(snap()); restore(future.pop()); } };

// ---- 그리기 ----
const screenScale = () => cv.width / cv.getBoundingClientRect().width;  // 화면 1px = 캔버스 몇 px
const corners = l => [[l.x, l.y, -1, -1], [l.x + l.w, l.y, 1, -1], [l.x, l.y + l.h, -1, 1], [l.x + l.w, l.y + l.h, 1, 1]];

function paint(c2d, layers, scale = 1) {
  c2d.setTransform(1, 0, 0, 1, 0, 0);
  c2d.clearRect(0, 0, c2d.canvas.width, c2d.canvas.height);
  c2d.setTransform(scale, 0, 0, scale, 0, 0);
  for (const l of layers) c2d.drawImage(l.img, l.x, l.y, l.w, l.h);
  c2d.setTransform(1, 0, 0, 1, 0, 0);
}

function thumb(frame) {
  const c = document.createElement('canvas'), h = 80;  // 화면 40px의 2배 해상도
  c.height = h; c.width = Math.round(h * cv.width / cv.height);
  paint(c.getContext('2d'), frame.layers, h / cv.height);
  return c;
}

function draw(clean = false) {
  paint(ctx, F().layers);
  if (sel && !clean) {
    const s = screenScale(), h = 10 * s;
    ctx.strokeStyle = '#31A8FF'; ctx.lineWidth = 1.5 * s;
    ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
    ctx.fillStyle = '#FFFFFF';
    for (const [x, y] of corners(sel)) { ctx.fillRect(x - h / 2, y - h / 2, h, h); ctx.strokeRect(x - h / 2, y - h / 2, h, h); }
  }
  $('info').textContent = `장면 ${cur + 1}/${frames.length} · ${cv.width} × ${cv.height} · ${Math.round(100 / screenScale())}%`;
  for (const [k, v] of [['px', sel?.x], ['py', sel?.y], ['pw', sel?.w], ['ph', sel?.h]]) {
    if (document.activeElement !== $(k)) $(k).value = sel ? Math.round(v) : '';
  }
}

function refresh() {
  const layers = F().layers;
  // 레이어 목록
  const ul = $('layers');
  ul.textContent = '';
  for (const l of [...layers].reverse()) {
    const li = document.createElement('li'), row = document.createElement('button');
    row.className = 'row';
    row.setAttribute('aria-pressed', l === sel);
    const img = new Image(); img.src = l.img.src; img.alt = '';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = l.name;
    const dim = document.createElement('span'); dim.className = 'dim'; dim.textContent = `${Math.round(l.w)}×${Math.round(l.h)}`;
    row.append(img, name, dim);
    row.onclick = () => { sel = l; refresh(); };
    li.append(row); ul.append(li);
  }
  // 장면 줄
  const fl = $('frame-list');
  fl.textContent = '';
  frames.forEach((f, i) => {
    const b = document.createElement('button'), n = document.createElement('b');
    b.className = 'frame';
    b.setAttribute('aria-pressed', i === cur);
    b.setAttribute('aria-label', `장면 ${i + 1}`);
    n.textContent = i + 1;
    b.append(thumb(f), n);
    b.onclick = () => { if (i !== cur) { cur = i; sel = null; refresh(); } };
    fl.append(b);
  });
  fl.children[cur].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('frame-del').hidden = frames.length < 2;
  // 내보내기: 장면별 시간
  const durs = $('durs');
  durs.textContent = '';
  frames.forEach((f, i) => {
    const li = document.createElement('li'), label = document.createElement('span'), inp = document.createElement('input');
    label.textContent = `장면 ${i + 1}`;
    Object.assign(inp, { className: 'num', type: 'number', inputMode: 'decimal', min: '0.1', step: '0.1', value: f.dur });
    inp.setAttribute('aria-label', `장면 ${i + 1} 표시 시간 (초)`);
    inp.onchange = () => { save(); f.dur = clampDur(Number(inp.value)); refresh(); };
    li.append(thumb(f), label, inp);
    durs.append(li);
  });
  const anim = frames.length > 1;
  $('anim').hidden = !anim;
  $('e-format').textContent = anim ? `움직이는 WebP · 장면 ${frames.length}개 · 화질 90%` : 'WebP · 화질 90%';
  $('e-size').textContent = `${cv.width} × ${cv.height} px`;
  // 버튼 상태
  const i = layers.indexOf(sel);
  $('empty').hidden = layers.length > 0;
  $('props').hidden = $('actions').hidden = layers.length === 0;
  for (const id of ['px', 'py', 'pw', 'ph']) $(id).disabled = !sel;
  $('fwd').disabled = !sel || i === layers.length - 1;
  $('back').disabled = !sel || i === 0;
  $('del').disabled = $('fit-contain').disabled = $('fit-cover').disabled = !sel;
  $('undo').disabled = !past.length;
  $('redo').disabled = !future.length;
  draw();
}

// ---- 장면 ----
$('frame-add').onclick = () => { save(); frames.push({ layers: [], dur: durDefault() }); cur = frames.length - 1; sel = null; refresh(); };
$('frame-del').onclick = () => {
  if (frames.length < 2) return;
  save(); frames.splice(cur, 1); cur = Math.min(cur, frames.length - 1); sel = null; refresh();
};
$('dur-apply').onclick = () => { const d = durDefault(); $('dur-all').value = d; save(); frames.forEach(f => f.dur = d); refresh(); };
$('loops').onchange = e => { e.target.value = Math.min(65535, Math.max(0, Math.round(Number(e.target.value)) || 0)); };

// ---- 레이어 조작 ----
function reorder(step) {
  const layers = F().layers, i = layers.indexOf(sel), j = i + step;
  if (!sel || j < 0 || j >= layers.length) return;
  save();
  [layers[i], layers[j]] = [layers[j], layers[i]];
  refresh();
}
$('fwd').onclick = () => reorder(1);
$('back').onclick = () => reorder(-1);
$('del').onclick = () => { if (!sel) return; save(); F().layers = F().layers.filter(l => l !== sel); sel = null; refresh(); };

// 캔버스 가운데에 비율 유지로 맞춤: contain = 전체가 보이게, cover = 빈틈없이 채우게
function fit(cover) {
  if (!sel) return;
  const k = (cover ? Math.max : Math.min)(cv.width / sel.w, cv.height / sel.h);
  save();
  sel.w *= k; sel.h *= k;
  sel.x = (cv.width - sel.w) / 2; sel.y = (cv.height - sel.h) / 2;
  refresh();
}
$('fit-contain').onclick = () => fit(false);
$('fit-cover').onclick = () => fit(true);

// 숫자 입력: W/H는 원본 비율을 유지한다
for (const id of ['px', 'py', 'pw', 'ph']) {
  $(id).onchange = e => {
    const v = Number(e.target.value);
    if (!sel || !Number.isFinite(v) || (id === 'pw' || id === 'ph') && v < 1) return draw();
    save();
    if (id === 'px') sel.x = v;
    if (id === 'py') sel.y = v;
    if (id === 'pw') { sel.h *= v / sel.w; sel.w = v; }
    if (id === 'ph') { sel.w *= v / sel.h; sel.h = v; }
    refresh();
  };
}

function addFiles(files) {
  const frame = F();  // 로딩 중에 장면을 바꿔도 처음 장면에 들어가게
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const img = new Image();
    img.onload = () => {
      // 캔버스 안에 들어오게 줄여서 가운데 배치 (확대는 하지 않음)
      const s = Math.min(cv.width / img.naturalWidth, cv.height / img.naturalHeight, 1);
      const w = img.naturalWidth * s, h = img.naturalHeight * s;
      if (!frames.includes(frame)) return;  // 그 사이 장면이 삭제됨
      save();
      const layer = { img, name: f.name, w, h, x: (cv.width - w) / 2, y: (cv.height - h) / 2 };
      frame.layers.push(layer);
      if (frame === F()) sel = layer;
      refresh();
    };
    img.onerror = () => alert(`${f.name}: 이미지를 읽을 수 없습니다.`);
    img.src = URL.createObjectURL(f);
  }
}
$('add').onclick = $('add2').onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });

// ---- 캔버스 터치/마우스: 모서리는 크기 조절(비율 유지, 반대쪽 모서리 고정), 본체는 이동 ----
let drag = null;
const toCanvas = e => {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
};
const cornerAt = p => {
  if (!sel) return null;
  const r = HIT * screenScale();
  return corners(sel).find(([x, y]) => Math.abs(p.x - x) < r && Math.abs(p.y - y) < r) || null;
};
const hit = p => [...F().layers].reverse().find(l => p.x >= l.x && p.x <= l.x + l.w && p.y >= l.y && p.y <= l.y + l.h);

cv.addEventListener('pointerdown', e => {
  const p = toCanvas(e), c = cornerAt(p);
  if (!c) { sel = hit(p) || null; refresh(); }
  if (!sel) return;
  drag = { p, corner: c, x: sel.x, y: sel.y, w: sel.w, h: sel.h, before: snap(), moved: false };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const p = toCanvas(e);
  if (!drag) { cv.style.cursor = cornerAt(p) ? 'nwse-resize' : hit(p) ? 'move' : 'default'; return; }
  const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
  drag.moved = true;
  if (drag.corner) {
    const [, , sx, sy] = drag.corner;
    const k = Math.max(16 / drag.w, (drag.w + sx * dx) / drag.w);
    sel.w = drag.w * k; sel.h = drag.h * k;
    sel.x = sx > 0 ? drag.x : drag.x + drag.w - sel.w;
    sel.y = sy > 0 ? drag.y : drag.y + drag.h - sel.h;
  } else {
    sel.x = drag.x + dx; sel.y = drag.y + dy;
  }
  draw();
});
const endDrag = () => { if (drag?.moved) { save(drag.before); refresh(); } drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ---- 비율 (모든 장면 공통) ----
function setRatio(r) {
  ratio = r;
  const [a, b] = r.split(':').map(Number);
  cv.width  = a >= b ? LONG_SIDE : Math.round(LONG_SIDE * a / b);
  cv.height = a >= b ? Math.round(LONG_SIDE * b / a) : LONG_SIDE;
  for (const btn of document.querySelectorAll('.ratio')) btn.setAttribute('aria-pressed', btn.dataset.ratio === r);
  refresh();
}
for (const btn of document.querySelectorAll('.ratio')) btn.onclick = () => setRatio(btn.dataset.ratio);

// ---- 탭 ----
for (const tab of document.querySelectorAll('[role=tab]')) {
  tab.onclick = () => {
    for (const t of document.querySelectorAll('[role=tab]')) {
      t.setAttribute('aria-selected', t === tab);
      $(t.getAttribute('aria-controls')).hidden = t !== tab;
    }
  };
}

// ---- 움직이는 WebP 만들기 ----
// 브라우저는 정지 WebP만 만들 수 있어서, 장면별 WebP의 이미지 청크를 꺼내 ANIM/ANMF 컨테이너로 묶는다.
// 형식: https://developers.google.com/speed/webp/docs/riff_container
const ascii = s => [...s].map(ch => ch.charCodeAt(0));
const u24 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255];
function chunk(id, ...parts) {
  const size = parts.reduce((n, p) => n + p.length, 0), head = new Uint8Array(8);
  head.set(ascii(id));
  new DataView(head.buffer).setUint32(4, size, true);
  return size & 1 ? [head, ...parts, new Uint8Array(1)] : [head, ...parts];
}
function imageChunks(webp) {  // 정지 WebP -> ALPH / VP8 / VP8L 청크들 (헤더와 패딩 포함)
  const dv = new DataView(webp.buffer, webp.byteOffset, webp.byteLength), out = [];
  if (String.fromCharCode(...webp.subarray(8, 12)) !== 'WEBP') throw new Error('not webp');
  for (let p = 12; p + 8 <= webp.length;) {
    const id = String.fromCharCode(...webp.subarray(p, p + 4)), size = dv.getUint32(p + 4, true);
    const end = p + 8 + size + (size & 1);
    if (id === 'ALPH' || id === 'VP8 ' || id === 'VP8L') out.push(webp.subarray(p, end));
    p = end;
  }
  return out;
}
function animatedWebp(stills, w, h, durationsMs, loops) {
  const body = [
    ...chunk('VP8X', new Uint8Array([0x12, 0, 0, 0, ...u24(w - 1), ...u24(h - 1)])),  // 애니메이션 + 알파
    ...chunk('ANIM', new Uint8Array([0, 0, 0, 0, loops & 255, loops >> 8])),           // 배경 투명, 반복 횟수 (0 = 무한)
    ...stills.flatMap((s, i) => chunk('ANMF',
      // x, y = 0 / 크기 / 표시 시간(ms) / 0x02 = 이전 장면과 섞지 않고 덮어씀
      new Uint8Array([0, 0, 0, 0, 0, 0, ...u24(w - 1), ...u24(h - 1), ...u24(durationsMs[i]), 0x02]),
      ...imageChunks(s))),
  ];
  const size = 4 + body.reduce((n, p) => n + p.length, 0), head = new Uint8Array(12);
  head.set(ascii('RIFF')); new DataView(head.buffer).setUint32(4, size, true); head.set(ascii('WEBP'), 8);
  return new Blob([head, ...body], { type: 'image/webp' });
}

function encodeFrame(frame) {
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  paint(c.getContext('2d'), frame.layers);
  return new Promise(resolve => c.toBlob(resolve, 'image/webp', QUALITY));
}

// ---- 저장 ----
$('save').onclick = async () => {
  if (frames.every(f => !f.layers.length)) return alert('먼저 이미지를 불러오세요.');
  const stills = await Promise.all(frames.map(encodeFrame));
  // WebP를 못 만드는 브라우저는 조용히 PNG를 돌려준다
  if (stills.some(b => !b || b.type !== 'image/webp')) return alert('이 브라우저는 WebP 저장을 지원하지 않습니다. Chrome, Edge, Firefox를 사용하세요.');
  const out = stills.length === 1 ? stills[0] : animatedWebp(
    await Promise.all(stills.map(async b => new Uint8Array(await b.arrayBuffer()))),
    cv.width, cv.height, frames.map(f => Math.round(f.dur * 1000)), Number($('loops').value) || 0);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = 'thumbnail.webp';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

addEventListener('resize', () => draw());
setRatio(ratio);
</script>
</body>
</html>
