<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixora</title>
<style>
  :root { --bg:#f4f4f6; --panel:#fff; --line:#d8d8de; --fg:#1c1c22; --muted:#6b6b76; --accent:#5b5bd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --panel:#202026; --line:#34343c; --fg:#ececf1; --muted:#9a9aa6; --accent:#8b8bf0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-columns:1fr 260px; height:100vh; }
  @media (max-width:700px) { body { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; } }
  main { display:flex; align-items:center; justify-content:center; padding:16px; min-width:0; min-height:0; }
  canvas { max-width:100%; max-height:100%; touch-action:none; box-shadow:0 2px 12px #0003;
           background:repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/16px 16px; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:12px;
          display:flex; flex-direction:column; gap:12px; overflow:auto; }
  label { display:flex; flex-direction:column; gap:4px; font-weight:600; }
  select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px;
                   background:var(--bg); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  ul { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  li { display:flex; align-items:center; gap:6px; padding:4px; border:1px solid var(--line); border-radius:6px; }
  li.sel { border-color:var(--accent); }
  li img { width:36px; height:36px; object-fit:cover; border-radius:4px; }
  li .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
             border:0; background:none; text-align:left; padding:2px; }
  li button:not(.name) { padding:2px 8px; }
  .hint { color:var(--muted); font-size:12px; margin:8px 0 0; }
</style>
</head>
<body>
<main><canvas id="c" aria-label="썸네일 캔버스"></canvas></main>
<aside>
  <label>비율
    <select id="ratio">
      <option>1:1</option>
      <option>4:3</option>
      <option selected>16:9</option>
      <option>9:16</option>
      <option>3:4</option>
    </select>
  </label>
  <button id="add">이미지 불러오기</button>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <section>
    <strong>레이어 (위쪽이 맨 앞)</strong>
    <ul id="layers"></ul>
    <p class="hint" id="empty">이미지를 불러오거나 화면에 끌어다 놓으세요.</p>
  </section>
  <button id="save" class="primary">WebP로 저장</button>
</aside>
<script>
const LONG_SIDE = 1280, HANDLE = 28, QUALITY = 0.9;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let layers = [];  // 뒤 -> 앞. 마지막 요소가 맨 위에 그려진다.
let sel = null;

function setRatio() {
  const [a, b] = $('ratio').value.split(':').map(Number);
  cv.width  = a >= b ? LONG_SIDE : Math.round(LONG_SIDE * a / b);
  cv.height = a >= b ? Math.round(LONG_SIDE * b / a) : LONG_SIDE;
  draw();
}

function draw(clean = false) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (const l of layers) ctx.drawImage(l.img, l.x, l.y, l.w, l.h);
  if (sel && !clean) {
    ctx.strokeStyle = ctx.fillStyle = '#5b5bd6';
    ctx.lineWidth = 3;
    ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
    ctx.fillRect(sel.x + sel.w - HANDLE / 2, sel.y + sel.h - HANDLE / 2, HANDLE, HANDLE);
  }
}

function button(text, label, onclick, className = '') {
  const b = document.createElement('button');
  b.textContent = text; b.title = label; b.className = className; b.onclick = onclick;
  b.setAttribute('aria-label', label);
  return b;
}

function refresh() {
  const ul = $('layers');
  ul.textContent = '';
  $('empty').hidden = layers.length > 0;
  for (const l of [...layers].reverse()) {
    const li = document.createElement('li');
    if (l === sel) li.className = 'sel';
    const thumb = new Image(); thumb.src = l.img.src; thumb.alt = '';
    const name = button(l.name, `${l.name} 선택`, () => { sel = l; refresh(); }, 'name');
    li.append(thumb, name,
      button('▲', '앞으로', () => reorder(l, 1)),
      button('▼', '뒤로', () => reorder(l, -1)),
      button('✕', '삭제', () => { layers = layers.filter(x => x !== l); if (sel === l) sel = null; refresh(); }));
    ul.append(li);
  }
  draw();
}

function reorder(l, step) {
  const i = layers.indexOf(l), j = i + step;
  if (j < 0 || j >= layers.length) return;
  [layers[i], layers[j]] = [layers[j], layers[i]];
  refresh();
}

function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const img = new Image();
    img.onload = () => {
      // 캔버스 안에 들어오게 줄여서 가운데 배치 (확대는 하지 않음)
      const s = Math.min(cv.width / img.naturalWidth, cv.height / img.naturalHeight, 1);
      const w = img.naturalWidth * s, h = img.naturalHeight * s;
      sel = { img, name: f.name, w, h, x: (cv.width - w) / 2, y: (cv.height - h) / 2 };
      layers.push(sel);
      refresh();
    };
    img.onerror = () => alert(`${f.name}: 이미지를 읽을 수 없습니다.`);
    img.src = URL.createObjectURL(f);
  }
}

// 캔버스 조작: 오른쪽 아래 핸들은 크기 조절(비율 유지), 이미지 본체는 이동
let drag = null;
const toCanvas = e => {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
};
const onHandle = p => sel && Math.abs(p.x - sel.x - sel.w) < HANDLE && Math.abs(p.y - sel.y - sel.h) < HANDLE;
const hit = p => [...layers].reverse().find(l => p.x >= l.x && p.x <= l.x + l.w && p.y >= l.y && p.y <= l.y + l.h);

cv.addEventListener('pointerdown', e => {
  const p = toCanvas(e);
  if (onHandle(p)) {
    drag = { resize: true, p, w: sel.w, h: sel.h };
  } else {
    sel = hit(p) || null;
    drag = sel && { resize: false, p, x: sel.x, y: sel.y };
    refresh();
  }
  if (drag) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const p = toCanvas(e);
  cv.style.cursor = onHandle(p) ? 'nwse-resize' : hit(p) ? 'move' : 'default';
  if (!drag) return;
  if (drag.resize) {
    const k = Math.max(0.05, (drag.w + p.x - drag.p.x) / drag.w);
    sel.w = drag.w * k; sel.h = drag.h * k;
  } else {
    sel.x = drag.x + p.x - drag.p.x; sel.y = drag.y + p.y - drag.p.y;
  }
  draw();
});
cv.addEventListener('pointerup', () => { drag = null; });

$('ratio').onchange = setRatio;
$('add').onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });

$('save').onclick = () => {
  if (!layers.length) return alert('먼저 이미지를 불러오세요.');
  draw(true);  // 선택 테두리 없이 그린 뒤 저장
  cv.toBlob(blob => {
    draw();
    // WebP를 못 만드는 브라우저는 조용히 PNG를 돌려준다
    if (!blob || blob.type !== 'image/webp') return alert('이 브라우저는 WebP 저장을 지원하지 않습니다. Chrome, Edge, Firefox를 사용하세요.');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'thumbnail.webp';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/webp', QUALITY);
};

setRatio();
</script>
</body>
</html>
